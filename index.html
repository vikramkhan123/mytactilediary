<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactile Journal Pro</title>
  <style>
    :root {
      --bg-color: #F4F6F9;
      --card-bg: #FFFFFF;
      --primary: #FF6B81;
      --primary-shadow: #E0526B;
      --accent: #70A1FF;
      --text-dark: #2F3542;
      --text-muted: #A4B0BE;
      --border-color: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .app-header {
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
      max-width: 450px;
    }

    .app-header h1 {
      font-size: 24px;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 450px;
    }

    /* Card Box */
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 100px;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      font-size: 14px;
      outline: none;
      resize: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    /* Mood Selector */
    .mood-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin: 12px 0 6px 0;
    }

    .mood-selector {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .mood-btn {
      background: #F1F2F6;
      border: none;
      font-size: 20px;
      padding: 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      flex: 1;
      margin: 0 3px;
    }

    .mood-btn.selected {
      background: #FFEAA7;
      transform: scale(1.15);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    /* Row Inputs */
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      font-size: 13px;
      outline: none;
    }

    .icon-btn {
      background: #F1F2F6;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Tactile Button */
    .btn-primary {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 18px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 5px 0px var(--primary-shadow);
      transition: all 0.1s ease;
    }

    .btn-primary:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0px var(--primary-shadow);
    }

    /* Utility Bar: Search & Backup */
    .utility-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .search-input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      outline: none;
      font-size: 13px;
      background: white;
    }

    .btn-small {
      background: white;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Feed & Memory Cards */
    .entry-card {
      background: white;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      border-left: 6px solid var(--accent);
      position: relative;
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .entry-date {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: bold;
    }

    .entry-location {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .entry-text {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 8px;
      white-space: pre-wrap;
    }

    .entry-img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 14px;
      margin-top: 8px;
    }

    .delete-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: transparent;
      border: none;
      font-size: 16px;
      color: var(--text-muted);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <h1>✨ Tactile Diary Pro</h1>
  </div>

  <div class="container">
    <!-- Creation Card -->
    <div class="card">
      <textarea id="noteInput" placeholder="What's on your mind today?"></textarea>
      
      <div class="mood-title">Pick Mood:</div>
      <div class="mood-selector">
        <button class="mood-btn selected" onclick="selectMood(this, '😊')">😊</button>
        <button class="mood-btn" onclick="selectMood(this, '✈️')">✈️</button>
        <button class="mood-btn" onclick="selectMood(this, '🏔️')">🏔️</button>
        <button class="mood-btn" onclick="selectMood(this, '☕')">☕</button>
        <button class="mood-btn" onclick="selectMood(this, '🍕')">🍕</button>
        <button class="mood-btn" onclick="selectMood(this, '💡')">💡</button>
      </div>

      <div class="input-row">
        <input type="text" id="locationInput" placeholder="📍 Add location...">
        <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleImage(this)">
        <button class="icon-btn" onclick="document.getElementById('imageInput').click()">📸 Photo</button>
      </div>

      <div id="imagePreviewContainer"></div>

      <button class="btn-primary" onclick="saveMemory()">Save Entry 📌</button>
    </div>

    <!-- Utility Bar (Search & Backup) -->
    <div class="utility-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search notes or locations..." oninput="renderFeed()">
      <button class="btn-small" onclick="exportData()">💾 Backup</button>
    </div>

    <!-- Feed Container -->
    <div id="feedContainer"></div>
  </div>

  <script>
    let currentMood = "😊";
    let selectedImageBase64 = "";

    document.addEventListener("DOMContentLoaded", renderFeed);

    function selectMood(btn, mood) {
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      currentMood = mood;
    }

    function handleImage(input) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          selectedImageBase64 = e.target.result;
          document.getElementById('imagePreviewContainer').innerHTML = 
            `<img src="${selectedImageBase64}" style="width:100%; border-radius:12px; max-height:160px; object-fit:cover; margin-bottom:12px;">`;
        };
        reader.readAsDataURL(file);
      }
    }

    function saveMemory() {
      const text = document.getElementById("noteInput").value;
      const location = document.getElementById("locationInput").value;

      if (!text.trim() && !selectedImageBase64) return;

      const memory = {
        id: Date.now(),
        text: text,
        mood: currentMood,
        location: location || "Personal Log",
        image: selectedImageBase64,
        date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
      };

      let feed = JSON.parse(localStorage.getItem("offline_memories") || "[]");
      feed.unshift(memory);
      localStorage.setItem("offline_memories", JSON.stringify(feed));

      // Reset Form
      document.getElementById("noteInput").value = "";
      document.getElementById("locationInput").value = "";
      selectedImageBase64 = "";
      document.getElementById('imagePreviewContainer').innerHTML = "";

      renderFeed();
    }

    function deleteMemory(id) {
      if (confirm("Are you sure you want to delete this memory?")) {
        let feed = JSON.parse(localStorage.getItem("offline_memories") || "[]");
        feed = feed.filter(item => item.id !== id);
        localStorage.setItem("offline_memories", JSON.stringify(feed));
        renderFeed();
      }
    }

    function renderFeed() {
      const container = document.getElementById("feedContainer");
      const searchQuery = document.getElementById("searchInput").value.toLowerCase();
      container.innerHTML = "";

      let feed = JSON.parse(localStorage.getItem("offline_memories") || "[]");

      // Search Filter
      const filtered = feed.filter(item => 
        item.text.toLowerCase().includes(searchQuery) || 
        item.location.toLowerCase().includes(searchQuery)
      );

      if (filtered.length === 0) {
        container.innerHTML = `<p style="text-align:center; color: var(--text-muted); margin-top:20px;">No memories found ✨</p>`;
        return;
      }

      filtered.forEach(item => {
        const div = document.createElement("div");
        div.className = "entry-card";
        div.innerHTML = `
          <button class="delete-btn" onclick="deleteMemory(${item.id})">🗑️</button>
          <div class="entry-header">
            <span class="entry-date">${item.date}</span>
            <span style="font-size: 18px;">${item.mood || '😊'}</span>
          </div>
          <div class="entry-location">📍 ${item.location}</div>
          <p class="entry-text">${item.text}</p>
          ${item.image ? `<img src="${item.image}" class="entry-img">` : ''}
        `;
        container.appendChild(div);
      });
    }

    // Export Data to JSON file
    function exportData() {
      const data = localStorage.getItem("offline_memories") || "[]";
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `diary_backup_${Date.now()}.json`;
      a.click();
    }
  </script>
</body>
</html>
